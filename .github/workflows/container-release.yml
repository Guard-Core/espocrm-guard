name: Publish Containerized Demo

on:
  release:
    types: [created]
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - 'src/**'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publish-container:
    name: publish-container
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the extension zip into the example
        run: |
          npm ci
          npm run extension
          cp build/guard-core-*.zip examples/advanced_app/guard-core.zip

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest

      - name: Build with Docker Compose
        working-directory: ./examples/advanced_app
        run: docker compose build espocrm

      - name: Tag and push to GHCR
        run: |
          IMAGE="ghcr.io/guard-core/espocrm-guard-example"
          docker tag espocrm-guard-advanced-app:local "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

          if [[ "${IS_RELEASE}" == "true" ]]; then
            docker tag espocrm-guard-advanced-app:local "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${VERSION}"
          fi
